name: Build 3DSX
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - run: dkp-pacman -S --noconfirm --needed 3ds-dev
      - run: make
      - uses: actions/upload-artifact@v4
        with:
          name: afterbeat_3ds
          path: afterbeat_3ds.3dsx
